<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <title>RBC Prototype</title>
    <style>
      /* Print-only sales log report (Reports > Sales Dashboard > Sales Log card) */
      .print-sales-log {
        display: none;
      }
      @media print {
        body * {
          visibility: hidden;
        }
        .print-receipt,
        .print-receipt * {
          visibility: visible;
        }
        .print-receipt {
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          width: 100% !important;
          max-width: none !important;
          min-height: 100vh;
          margin: 0 !important;
          padding: 2rem !important;
          box-shadow: none !important;
        }
        .print-sales-log,
        .print-sales-log * {
          visibility: visible;
        }
        .print-sales-log {
          display: block !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 1rem !important;
          background: #ffffff !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
